services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: camera_knowledge_db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: camera_knowledge_db
      PGUSER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: camera_knowledge_app
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=camera_knowledge_db
      - POSTGRES_USER=postgres
      - LLM_URL=${LLM_URL:-http://localhost:11434/v1}
      - API_KEY=${API_KEY:-ollama}
      - MODEL=${MODEL:-llama3.2}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app/app

  init-db:
    build: .
    container_name: camera_knowledge_init_db
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=camera_knowledge_db
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "python", "init_db.py"]

volumes:
  pgdata:
